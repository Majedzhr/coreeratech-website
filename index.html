<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#050E1F;color:#fff;font:400 17px/1.6 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
body:before{content:"";position:absolute;width:700px;height:700px;left:50%;top:45%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(29,111,224,.35),transparent 65%);filter:blur(40px);z-index:0}
body:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%);z-index:0}
main{position:relative;z-index:1;text-align:center;max-width:560px}
.mark{display:flex;align-items:center;justify-content:center;gap:4px;font:700 clamp(44px,10vw,72px)/1 'Space Grotesk',sans-serif;letter-spacing:.02em}
.mark svg{height:.7em;width:auto}
.tag{color:#9FB0C8;font:300 clamp(17px,3vw,20px) 'Space Grotesk',sans-serif;margin:14px 0 0}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif;color:#9FB0C8;margin:4px 0 0;font-size:17px}
.soon{display:inline-flex;align-items:center;gap:10px;margin-top:40px;padding:8px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);font-size:15px;color:#D5DFEE}
.soon i{width:8px;height:8px;border-radius:50%;background:#38C6F4;box-shadow:0 0 0 0 rgba(56,198,244,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(56,198,244,0)}100%{box-shadow:0 0 0 0 rgba(56,198,244,0)}}
.mail{display:block;margin-top:22px;color:#9FB0C8;font-size:15px}
.mail a{color:#fff}
@media (prefers-reduced-motion:reduce){.soon i{animation:none}}
</style>
</head>
<body>
<main>
  <h1 class="mark" aria-label="CoreEra">
    <span>COR</span>
    <svg viewBox="0 0 74 70" aria-hidden="true"><rect x="32" y="0" width="12" height="70" fill="#fff"/><rect x="0" y="0" width="74" height="12" fill="#fff"/><rect x="4" y="29" width="66" height="12" fill="#1D6FE0"/><rect x="0" y="58" width="74" height="12" fill="#fff"/></svg>

  <p class="ar" lang="ar" dir="rtl">جوهر العصر الرقمي</p>
  <div class="soon"><i aria-hidden="true"></i>Coming soon · <span lang="ar">قريباً</span></div>
  <span class="mail"><a href="mailto:info@coreeratech.com">info@coreeratech.com</a></span>
</main>
</body>
